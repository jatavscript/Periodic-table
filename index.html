<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Periodic Table</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="animated-bg">
  <svg width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100vw;height:100vh;">
    <defs>
      <radialGradient id="bg1" cx="60%" cy="30%" r="1.2">
        <stop offset="0%" stop-color="#e0c3fc" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#e7e0f7" stop-opacity="0.2"/>
      </radialGradient>
      <radialGradient id="bg2" cx="20%" cy="80%" r="1.1">
        <stop offset="0%" stop-color="#b6e0fe" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#e7e0f7" stop-opacity="0.1"/>
      </radialGradient>
      <radialGradient id="bg3" cx="80%" cy="70%" r="1.1">
        <stop offset="0%" stop-color="#fbc2eb" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#e7e0f7" stop-opacity="0.1"/>
      </radialGradient>
    </defs>
    <circle cx="1200" cy="350" r="400" fill="url(#bg1)">
      <animate attributeName="cy" values="350;370;350" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="900" r="350" fill="url(#bg2)">
      <animate attributeName="cx" values="400;420;400" dur="10s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="1600" cy="800" rx="250" ry="180" fill="url(#bg3)">
      <animate attributeName="rx" values="250;270;250" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </svg>
</div>

<h2 style="text-align:center;">Periodic Table (Hover for Details)</h2>
<div class="filter-card">
  <div>
    <label for="categoryFilter"><strong>Category</strong></label><br>
    <select id="categoryFilter">
      <option value="all">All Elements</option>
    </select>
  </div>
  <div>
    <label for="periodFilter"><strong>Period</strong></label><br>
    <select id="periodFilter">
      <option value="all">All Periods</option>
    </select>
  </div>
  <div>
    <label for="groupFilter"><strong>Group</strong></label><br>
    <select id="groupFilter">
      <option value="all">All Groups</option>
    </select>
  </div>
  <div>
    <label for="blockFilter"><strong>Block</strong></label><br>
    <select id="blockFilter">
      <option value="all">All Blocks</option>
      <option value="s">s</option>
      <option value="p">p</option>
      <option value="d">d</option>
      <option value="f">f</option>
    </select>
  </div>
</div>
<div class="table-card">
  <div id="periodicTable" class="periodic-table-grid"></div>
  
</div>

<div class="details-panel" id="detailsPanel">
  <h3 id="elementName">Element</h3>
  <p class="panel-text"><strong>Symbol:</strong> <span id="elementSymbol">-</span></p>
  <p class="panel-text"><strong>Atomic Number:</strong> <span id="elementNumber">-</span></p>
  <p class="panel-text"><strong>Atomic Mass:</strong> <span id="elementMass">-</span></p>
  <p class="panel-text"><strong>Discovered by:</strong> <span id="elementDiscoverer">-</span></p>
  <p class="panel-text"><strong>Year:</strong> <span id="elementYear">-</span></p>
</div>

<script src="script.js"></script>
</body>

</html>
